<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Village</title>
  <meta name="description" content="Get in touch with the Village team.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo"><img src="/images/logo-nav.png" alt="Village" height="36"></a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <ul class="nav-links">
        <li><a href="/features">Features</a></li>
        <li><a href="/pricing">Pricing</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact">Contact</a></li>
        <li><a href="https://my.villagefamily.app" class="cta-nav">Sign In</a></li>
      </ul>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h1>Contact Us</h1>
      <p>Have a question, suggestion, or just want to say hi? We'd love to hear from you.</p>
    </div>
  </div>

  <section>
    <div class="container">
      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required maxlength="200" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="200" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required maxlength="200" placeholder="What's this about?">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" required maxlength="5000" placeholder="Tell us what's on your mind..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
        <div id="form-status" class="form-status"></div>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 Village. <a href="/contact">Contact Us</a></p>
    </div>
  </footer>

  <script src="/js/contact.js"></script>
</body>
</html>
